name: Angel Fast Api Demo

on:
  push:
    branches:
      - master
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # <-- Cambia de 3.12 a 3.11
      
      - name: Install dependencies
        run: |
          pip3 install -r requirements.txt
      
      - name: Run unittests
        run: |
          pytest test/test.py 
      
      - name: docker build
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/python-fastapi-demo:${{ github.sha }} .

      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker push
        run: |
          docker push a${{ secrets.DOCKER_USERNAME }}/python-fastapi-demo:${{ github.sha }}